<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P-Auth demo</title>
</head>
<body>

  <h1>P-Auth Demo</h1>
  <p>This is a demo page for the P-Auth component, using the public
    <a href="https://demo.duendesoftware.com">demo.duendesoftware.com</a>
    identity provider (client <code>interactive.public.short</code>).</p>

  <p-auth sw-url="/dist/sw.js" sw-scope="/">

    <p-code-flow
      discovery-url="https://demo.duendesoftware.com/"
      client-id="interactive.public.short"
      scope="openid email profile offline_access"
      callback-path="/demo/callback.html"
      url-pattern="(/api/data-sample-request|demo.duendesoftware.com/api/|demo.duendesoftware.com/connect/userinfo)"
    ></p-code-flow>

    <!-- Example: configure additional identity providers by adding more
         p-code-flow elements with their own url-pattern, e.g.

    <p-code-flow
      discovery-url="https://auth.example.com/"
      client-id="my-client"
      scope="openid profile"
      callback-path="/demo/callback.html"
      url-pattern="(https://api.example.com/)"
    ></p-code-flow>
    -->

  </p-auth>

  <button id="fetchButton">Do fetch</button>
  <button id="logoutButton">Logout</button>
  <script src="../dist/p-auth.js" type="module"></script>

  <script defer>

    const url1 = "https://demo.duendesoftware.com/api/test";

    document.getElementById('logoutButton').addEventListener('click', () => {
      const codeFlow = document.querySelector('p-code-flow[client-id="interactive.public.short"]');
      if (codeFlow) {
        codeFlow.logout("/");
      } else {
        console.error('Code flow for interactive.public.short not found');
      }
    });

    document.getElementById('fetchButton').addEventListener('click', () => {
      document.getElementById('output1').textContent = "";
      fetch(url1)
        .then(response => {
          if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
          }
          return response.json();
        })
        .then(data => {
          document.getElementById('output1').textContent = JSON.stringify(data, null, 2);
        })
        .catch(error => {
          console.error('Error fetching data:', error);
        });
    });

    window.addEventListener("DOMContentLoaded", () => {

      document.getElementById('output1').textContent = "";
      document.getElementById('output2').textContent = "";

      document.querySelector("p-auth").addEventListener("authInitialised", () => {
        console.log("P-Auth initialized");
      });

      document.querySelector("p-auth").addEventListener("authError", (event) => {
        console.error("P-Auth error:", event.detail);
      });

      // Initial fetch on page load; queued until authentication is ready
      fetch(url1)
        .then(response => {
          if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
          }
          return response.json();
        })
        .then(data => {
          document.getElementById('output2').textContent = JSON.stringify(data, null, 2);
        })
        .catch(error => {
          console.error('Error during initial fetch:', error);
        });
    });

  </script>
  <pre id="output1"></pre>
  <pre id="output2"></pre>
</body>
</html>
